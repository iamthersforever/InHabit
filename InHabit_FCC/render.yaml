services:
  - type: web
    name: inhabit-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://inhabit-fcc.onrender.com

  - type: web
    runtime: static
    name: inhabit-fcc
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://inhabit-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
